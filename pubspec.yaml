name: mottainai_customer
description: Mottainai Waste Management Customer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & Networking
  http: ^1.2.2
  dio: ^5.7.0

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Navigation — 16.1.0 requires Dart ^3.6.0
  go_router: ^16.1.0

  # UI Components
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  pinput: ^5.0.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  package_info_plus: ^5.0.1

  # Firebase (FCM push notifications) — 3.x/15.x require Dart >=3.2.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  # flutter_local_notifications 19.5.0 requires Dart ^3.4.0
  flutter_local_notifications: ^19.5.0

  # File handling
  path_provider: ^2.1.5
  open_file: ^3.5.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/images/logo.png"
