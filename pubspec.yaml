name: mottainai_customer
description: Mottainai Waste Management Customer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & Networking
  http: ^1.6.0
  dio: ^5.9.2

  # State Management
  provider: ^6.1.5

  # Local Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0

  # Navigation
  go_router: ^14.6.2

  # UI Components
  flutter_svg: ^2.2.4
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  pinput: ^6.0.2
  intl: ^0.20.2
  url_launcher: ^6.3.2
  package_info_plus: ^10.0.0

  # Paystack (latest available version)
  flutter_paystack: ^1.0.7

  # Firebase (FCM push notifications)
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0

  # File handling
  path_provider: ^2.1.5
  open_file: ^3.5.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/images/logo.png"
