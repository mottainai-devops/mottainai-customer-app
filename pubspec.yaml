name: mottainai_customer
description: Mottainai Waste Management Customer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & Networking
  http: ^1.2.2
  dio: ^5.7.0

  # State Management
  provider: ^6.1.1

  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Navigation
  go_router: ^14.6.2

  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  pinput: ^5.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3

  # Paystack
  flutter_paystack: ^2.0.0

  # Firebase (FCM push notifications)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # File handling
  path_provider: ^2.1.5
  open_file: ^3.5.10
  path: ^1.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/images/logo.png"
