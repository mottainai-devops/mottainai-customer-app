import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Load signing properties from key.properties (injected by CI/CD or local dev)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.mottainai.customer"
    compileSdk = 35
    // Required by firebase_core, firebase_messaging, flutter_local_notifications,
    // flutter_secure_storage, package_info_plus, path_provider, shared_preferences,
    // url_launcher, open_file (all require NDK 27.0.12077973)
    ndkVersion = "27.0.12077973"

    compileOptions {
        // Required by flutter_local_notifications (core library desugaring)
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias'] ?: 'mottainai-release'
            keyPassword = keystoreProperties['keyPassword'] ?: ''
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword'] ?: ''
        }
    }

    defaultConfig {
        applicationId = "com.mottainai.customer"
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            shrinkResources = false
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    // Required for core library desugaring (flutter_local_notifications)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source = "../.."
}
